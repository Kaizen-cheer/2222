<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Shop - Welcome to Dino Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --primary-blue: #58a6ff;
            --accent-blue: #1f6feb;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --admin-gold: #f2c94c;
            --danger: #ff4b4b;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding-bottom: 80px;
        }

        header {
            background-color: var(--bg-card);
            padding: 12px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        #shop-logo { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; border: 2px solid var(--primary-blue); display: none; }
        .logo-text { font-size: 20px; font-weight: 600; color: var(--primary-blue); text-transform: uppercase; }

        .balance-box {
            background: rgba(88, 166, 255, 0.1);
            padding: 6px 15px; border-radius: 8px;
            border: 1px solid var(--primary-blue); color: var(--primary-blue);
        }

        .container { width: 92%; max-width: 1200px; margin: 30px auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

        /* แผงแอดมิน (ซ่อนไว้สำหรับเจ้าของร้าน) */
        #admin-panel {
            display: none; background: #1c2128; padding: 25px;
            border-radius: 12px; border: 2px solid var(--admin-gold); margin-bottom: 30px;
        }

        .product-card {
            background: var(--bg-card); border: 1px solid #30363d;
            border-radius: 12px; overflow: hidden; transition: 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); }
        .product-img { width: 100%; height: 180px; object-fit: cover; background: #21262d; }
        .product-info { padding: 15px; }
        .price-tag { font-size: 22px; color: var(--primary-blue); font-weight: 600; margin: 8px 0; }

        .btn {
            background: var(--accent-blue); color: white; border: none;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-family: 'Kanit';
        }
        .btn-gold { background: var(--admin-gold); color: black; font-weight: bold; }
        
        input {
            width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: white; margin-bottom: 10px; box-sizing: border-box;
        }

        .bank-info-box {
            background: #0d1117; padding: 20px; border-radius: 10px; border: 2px solid var(--primary-blue);
            margin: 10px 0; text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img id="shop-logo" src="" alt="logo">
        <span class="logo-text" id="display-shop-name">MY SHOP</span>
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="balance-box">฿ <span id="balance">0</span></div>
        <button class="btn" style="background:#30363d" id="login-btn" onclick="adminLogin()">Admin</button>
        <button class="btn" id="logout-btn" onclick="adminLogout()" style="display:none; background:#da3633">Logout</button>
    </div>
</header>

<div class="container">
    
    <!-- ADMIN ZONE (ซ่อนอยู่) -->
    <section id="admin-panel">
        <h3 style="color: var(--admin-gold); margin-top:0;">🛡️ สำหรับเจ้าของร้าน (Admin)</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div>
                <strong>ตั้งค่าร้าน:</strong>
                <input type="text" id="input-shop-name" placeholder="ชื่อร้าน" onchange="updateShopName()">
                <label>รูปโลโก้:</label>
                <input type="file" accept="image/*" onchange="previewLogo(event)">
            </div>
            <div>
                <strong>ลงสินค้าใหม่ (จะโชว์หน้าเว็บทันที):</strong>
                <input type="text" id="p-name" placeholder="ชื่อสินค้า">
                <input type="number" id="p-price" placeholder="ราคา">
                <input type="text" id="p-discord" placeholder="ลิงก์ Discord">
                <input type="file" id="p-img" accept="image/*">
                <button class="btn btn-gold" style="width:100%" onclick="addProduct()">เพิ่มสินค้าลงหน้าร้าน</button>
                <button class="btn" style="width:100%; background:gray; margin-top:5px" onclick="clearAllProducts()">ลบสินค้าทั้งหมด</button>
            </div>
        </div>
    </section>

    <h2>🛒 สินค้าที่มีจำหน่าย</h2>
    <!-- ส่วนนี้ที่คนทั่วไปจะเห็นและซื้อได้เลย -->
    <div class="grid" id="product-display"></div>

    <div style="margin-top: 50px; text-align: center; background: var(--bg-card); padding: 40px; border-radius: 15px; border: 1px dashed #444;">
        <h2 style="margin-top:0">💰 ช่องทางเติมเงิน</h2>
        <button class="btn" style="background:#238636; margin-bottom:20px; font-size:18px;" onclick="showBankInfo()">
            📥 ดูเลขบัญชีโอนเงิน
        </button>
        <br>
        <input type="file" id="slip" style="max-width: 280px;">
        <button class="btn" onclick="topup()">ยืนยันสลิป</button>
    </div>
</div>

<script>
    let userBalance = parseFloat(localStorage.getItem('userBalance')) || 0;
    let savedProducts = JSON.parse(localStorage.getItem('shopProducts')) || [];
    const ADMIN_CODE = "2212";

    const bankInfo = {
        number: "230-3-21237-2",
        name: "นายศิรวิทย์ ปัญจะมี"
    };

    // แสดงผลยอดเงินและสินค้าเมื่อโหลดหน้าเว็บ
    window.onload = () => {
        updateBalanceDisplay();
        renderProducts();
    };

    function adminLogin() {
        Swal.fire({ title: 'Admin Password', input: 'password' }).then(res => {
            if (res.value === ADMIN_CODE) {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'block';
            }
        });
    }

    function adminLogout() {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('login-btn').style.display = 'block';
        document.getElementById('logout-btn').style.display = 'none';
    }

    function addProduct() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const discord = document.getElementById('p-discord').value;
        const imgInput = document.getElementById('p-img');

        if(!name || !price || !discord || !imgInput.files[0]) return Swal.fire('เตือน','กรอกข้อมูลให้ครบ','warning');

        const reader = new FileReader();
        reader.onload = () => {
            const newProduct = { name, price, discord, img: reader.result };
            savedProducts.push(newProduct);
            localStorage.setItem('shopProducts', JSON.stringify(savedProducts));
            renderProducts(); // วาดรายการสินค้าใหม่ทันที
            Swal.fire('สำเร็จ','สินค้าขึ้นหน้าร้านแล้ว!','success');
        };
        reader.readAsDataURL(imgInput.files[0]);
    }

    // ฟังก์ชันวาดรายการสินค้า (คนทั่วไปจะเห็นส่วนนี้)
    function renderProducts() {
        const display = document.getElementById('product-display');
        display.innerHTML = '';
        savedProducts.forEach((p, index) => {
            display.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-img">
                    <div class="product-info">
                        <div style="font-weight:600; color:white;">${p.name}</div>
                        <div class="price-tag">${parseFloat(p.price).toLocaleString()} ฿</div>
                        <button class="btn" style="width:100%" onclick="handlePurchase(${p.price}, '${p.name}', '${p.discord}')">ซื้อสินค้า</button>
                    </div>
                </div>
            `;
        });
    }

    function clearAllProducts() {
        Swal.fire({ title: 'ลบทั้งหมด?', showCancelButton: true }).then(res => {
            if(res.isConfirmed) {
                savedProducts = [];
                localStorage.removeItem('shopProducts');
                renderProducts();
            }
        });
    }

    function showBankInfo() {
        Swal.fire({
            title: 'โอนเงินที่นี่',
            html: `<div class="bank-info-box"><b>กสิกรไทย</b><br><h2 style="color:white">${bankInfo.number}</h2><b>${bankInfo.name}</b></div>`
        });
    }

    function handlePurchase(cost, name, discordLink) {
        if (userBalance < cost) return Swal.fire('เงินไม่พอ','กรุณาเติมเงินก่อนครับ','error');
        
        Swal.fire({ title: 'ซื้อสินค้า?', text: `ยืนยันซื้อ ${name}`, showCancelButton: true }).then(res => {
            if(res.isConfirmed) {
                userBalance -= cost;
                updateBalanceDisplay();
                Swal.fire({
                    title: 'สำเร็จ! อ่านคำเตือนสำคัญ',
                    html: `<div style="background:#2a1b1b; color:#ffbaba; padding:15px; border-radius:8px; border:1px solid red; text-align:left;">
                            <b>1. เข้าเพียง 1 แอคเคาท์เท่านั้น</b><br>
                            <b>2. เพื่อให้ร้านโอนหัวได้ถูก</b><br><br>
                            <center><b style="color:white; background:red; padding:5px;">*หากเข้าหลายแอคแล้วโอนผิด ร้านไม่รับผิดชอบ!</b></center>
                           </div><br>
                           <a href="${discordLink}" target="_blank" style="display:inline-block; background:#5865F2; color:white; padding:10px 20px; text-decoration:none; border-radius:5px;">เข้า DISCORD รับสินค้า</a>`,
                    icon: 'success'
                });
            }
        });
    }

    function topup() {
        if(!document.getElementById('slip').files[0]) return Swal.fire('เตือน','แนบสลิปก่อน','warning');
        userBalance += 1000;
        updateBalanceDisplay();
        Swal.fire('สำเร็จ','เติมเงินสำเร็จ (จำลอง 1,000)','success');
    }

    function updateBalanceDisplay() {
        document.getElementById('balance').innerText = userBalance.toLocaleString();
        localStorage.setItem('userBalance', userBalance);
    }

    function updateShopName() {
        document.getElementById('display-shop-name').innerText = document.getElementById('input-shop-name').value;
    }
</script>

</body>
</html>
