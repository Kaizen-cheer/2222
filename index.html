<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Shop - Welcome To Dino Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --primary-blue: #58a6ff;
            --accent-blue: #1f6feb;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --admin-gold: #f2c94c;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 100px;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        #shop-logo { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 2px solid var(--primary-blue); display: none; }
        .logo-text { font-size: 22px; font-weight: 600; color: var(--primary-blue); }

        .nav-right { display: flex; gap: 15px; align-items: center; }
        .balance-box {
            background: rgba(88, 166, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
        }

        /* Admin Section - Hidden by default */
        #admin-panel {
            display: none;
            background: #1c2128;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid var(--admin-gold);
            margin-bottom: 40px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Grid & Cards */
        .container { width: 90%; max-width: 1200px; margin: 30px auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-top: 20px; }
        
        .product-card {
            background: var(--bg-card);
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); }
        .product-img { width: 100%; height: 200px; object-fit: cover; background: #21262d; }
        .product-info { padding: 15px; }
        .price-tag { font-size: 22px; color: #58a6ff; font-weight: 600; margin: 10px 0; }

        /* UI Elements */
        .btn {
            background: var(--accent-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Kanit';
        }
        .btn-admin { background: #30363d; border: 1px solid #444c56; font-size: 14px; }
        .btn-logout { background: #da3633; margin-top: 10px; }
        
        input {
            width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; box-sizing: border-box; margin-bottom: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img id="shop-logo" src="" alt="logo">
        <span class="logo-text" id="display-shop-name">MY SHOP</span>
    </div>
    <div class="nav-right">
        <div class="balance-box">ยอดเงิน: <span id="balance">0</span> ฿</div>
        <button class="btn btn-admin" id="login-btn" onclick="adminLogin()">แอดมินล็อกอิน</button>
        <button class="btn btn-logout" id="logout-btn" onclick="adminLogout()" style="display:none;">ออกจากระบบ</button>
    </div>
</header>

<div class="container">
    
    <!-- Admin Zone (Hidden) -->
    <section id="admin-panel">
        <h3 style="margin-top:0; color: var(--admin-gold);">⭐ แผงควบคุมแอดมิน</h3>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label>เปลี่ยนชื่อร้าน:</label>
                <input type="text" id="input-shop-name" placeholder="ระบุชื่อร้าน" onchange="updateShopName()">
                <label>โลโก้ร้าน:</label>
                <input type="file" accept="image/*" onchange="previewLogo(event)">
            </div>
            <div>
                <label>เพิ่มสินค้าใหม่:</label>
                <input type="text" id="p-name" placeholder="ชื่อสินค้า">
                <input type="number" id="p-price" placeholder="ราคา">
                <input type="file" id="p-img" accept="image/*">
                <button class="btn" style="width:100%; background: var(--admin-gold); color: black; font-weight: bold;" onclick="addProduct()">เพิ่มสินค้าลงหน้าร้าน</button>
            </div>
        </div>
    </section>

    <h2>🛒 รายการสินค้า</h2>
    <div class="grid" id="product-display">
        <!-- สินค้าเริ่มต้น -->
    </div>

    <!-- ส่วนของลูกค้า: เติมเงิน -->
    <div style="margin-top: 60px; text-align: center; background: var(--bg-card); padding: 30px; border-radius: 15px; border: 1px dashed var(--primary-blue);">
        <h3>💳 เติมเงินผ่านสลิป</h3>
        <button class="btn" style="background:none; border:1px solid #58a6ff; color:#58a6ff; margin-bottom:15px;" onclick="Swal.fire('ข้อมูลธนาคาร', 'กสิกรไทย: 012-3-45678-9', 'info')">คลิกเพื่อดูเลขบัญชี</button>
        <br>
        <input type="file" id="slip" style="max-width: 300px;">
        <br>
        <button class="btn" onclick="topup()">ยืนยันการเติมเงิน</button>
    </div>
</div>

<script>
    let balance = 0;
    const ADMIN_PASS = "2212";

    // 1. ระบบล็อกอินแอดมิน
    async function adminLogin() {
        const { value: password } = await Swal.fire({
            title: 'กรอกรหัสผ่านแอดมิน',
            input: 'password',
            inputPlaceholder: 'Password',
            inputAttributes: { autocapitalize: 'off', autocorrect: 'off' }
        });

        if (password === ADMIN_PASS) {
            Swal.fire('สำเร็จ', 'ยินดีต้อนรับแอดมิน', 'success');
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'block';
        } else if (password) {
            Swal.fire('ผิดพลาด', 'รหัสผ่านไม่ถูกต้อง!', 'error');
        }
    }

    function adminLogout() {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('login-btn').style.display = 'block';
        document.getElementById('logout-btn').style.display = 'none';
        Swal.fire('Logout', 'ออกจากระบบแอดมินแล้ว', 'info');
    }

    // 2. จัดการชื่อร้าน/โลโก้
    function updateShopName() {
        const name = document.getElementById('input-shop-name').value;
        document.getElementById('display-shop-name').innerText = name || "MY SHOP";
    }

    function previewLogo(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('shop-logo');
            output.src = reader.result;
            output.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // 3. เพิ่มสินค้า
    function addProduct() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const imgInput = document.getElementById('p-img');

        if(!name || !price || !imgInput.files[0]) {
            Swal.fire('เตือน', 'กรอกข้อมูลสินค้าให้ครบ', 'warning');
            return;
        }

        const reader = new FileReader();
        reader.onload = function() {
            const container = document.getElementById('product-display');
            container.innerHTML += `
                <div class="product-card">
                    <img src="${reader.result}" class="product-img">
                    <div class="product-info">
                        <div style="font-weight:600; font-size:18px;">${name}</div>
                        <div class="price-tag">${parseFloat(price).toLocaleString()} ฿</div>
                        <button class="btn" style="width:100%" onclick="buy(${price}, '${name}')">ซื้อสินค้า</button>
                    </div>
                </div>
            `;
            Swal.fire('เรียบร้อย', 'เพิ่มสินค้าใหม่แล้ว', 'success');
        };
        reader.readAsDataURL(imgInput.files[0]);
    }

    // 4. ระบบเติมเงิน & ซื้อ
    function topup() {
        if(!document.getElementById('slip').files[0]) {
            Swal.fire('หือ?', 'ลืมแนบสลิปหรือเปล่าครับ?', 'question');
            return;
        }
        Swal.fire({ title: 'ตรวจสอบสลิป...', timer: 1500, didOpen: () => Swal.showLoading() }).then(() => {
            balance += 1000;
            document.getElementById('balance').innerText = balance.toLocaleString();
            Swal.fire('สำเร็จ', 'ยอดเงินเข้า 1,000 ฿', 'success');
        });
    }

    function buy(cost, title) {
        if(balance < cost) {
            Swal.fire('เงินไม่พอ', 'กรุณาเติมเงินก่อนซื้อ ' + title, 'error');
        } else {
            balance -= cost;
            document.getElementById('balance').innerText = balance.toLocaleString();
            Swal.fire('ขอบคุณครับ', 'คุณซื้อ ' + title + ' สำเร็จ', 'success');
        }
    }
</script>

</body>
</html>
